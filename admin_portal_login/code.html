<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>FreeDmg - Admin Portal Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container": "#1f1f22",
                        "surface": "#131316",
                        "on-primary": "#002e69",
                        "on-secondary": "#480081",
                        "on-tertiary-container": "#4c1a00",
                        "on-tertiary-fixed-variant": "#7c2e00",
                        "on-primary-container": "#00285c",
                        "on-error": "#690005",
                        "primary-fixed-dim": "#adc6ff",
                        "primary": "#adc6ff",
                        "inverse-surface": "#e4e1e6",
                        "inverse-on-surface": "#303033",
                        "secondary-container": "#7701d0",
                        "tertiary-fixed": "#ffdbcc",
                        "error": "#FF453A",
                        "secondary-fixed-dim": "#dcb8ff",
                        "on-secondary-fixed": "#2c0051",
                        "on-surface": "#e4e1e6",
                        "outline": "#8b90a0",
                        "surface-bright": "#39393c",
                        "surface-container-low": "#1b1b1e",
                        "on-secondary-container": "#dcb7ff",
                        "on-error-container": "#ffdad6",
                        "outline-variant": "#414755",
                        "border-subtle": "rgba(255, 255, 255, 0.1)",
                        "on-secondary-fixed-variant": "#6700b5",
                        "surface-container-lowest": "#0e0e11",
                        "tertiary-container": "#ef6719",
                        "on-primary-fixed-variant": "#004493",
                        "tertiary": "#ffb595",
                        "error-container": "#93000a",
                        "on-primary-fixed": "#001a41",

                        "warning": "#FFD60A",
                        "surface-dim": "#131316",

                        "surface-container-high": "#2a2a2d",
                        "surface-tint": "#adc6ff",
                        "surface-glass": "rgba(255, 255, 255, 0.04)",
                        "surface-variant": "#353438",
                        "tertiary-fixed-dim": "#ffb595",
                        "bg-deep": "#050505",
                        "on-tertiary": "#571e00",
                        "on-surface-variant": "#c1c6d7",
                        "primary-container": "#4b8eff",
                        "surface-container-highest": "#353438",
                        "secondary-fixed": "#efdbff",
                        "inverse-primary": "#005bc1",
                        "on-tertiary-fixed": "#351000",
                        "on-background": "#e4e1e6",
                        "background": "#131316"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "24px",
                        "container-max": "1280px",
                        "stack-lg": "32px",

<style>
        body {
            background-color: #050505;
            color: #e4e1e6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Subtle animated background gradient */
        .ambient-bg {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 50%, rgba(75, 142, 255, 0.05) 0%, transparent 50%);
            animation: pulse 8s infinite alternate;
            z-index: 0;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.5; }
            100% { transform: scale(1.2); opacity: 1; }
        }

        .glass-card {
            background: rgba(15, 15, 18, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0px 20px 40px rgba(0, 0, 0, 0.5);
            position: relative;
            z-index: 10;
        }
        
        .input-glow:focus {
            border-color: #adc6ff;
            box-shadow: 0 0 10px rgba(173, 198, 255, 0.2);
            outline: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4b8eff, #005bc1);
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover {
            box-shadow: 0 0 15px rgba(75, 142, 255, 0.4);
            transform: translateY(-1px);
        }
    </style>
</head>
<body class="font-body-md text-body-md antialiased selection:bg-primary-container selection:text-on-primary-container">
<div class="ambient-bg"></div>
<main class="w-full max-w-md px-margin-mobile md:px-0">
<div class="glass-card rounded-xl p-8 md:p-10 w-full flex flex-col items-center">
<!-- Branding -->
<div class="mb-stack-lg flex flex-col items-center">
<span class="material-symbols-outlined text-[48px] text-primary mb-4" style="font-variation-settings: 'FILL' 1;">admin_panel_settings</span>
<h1 class="font-display-lg text-display-lg tracking-tighter text-on-surface">FreeDmg</h1>
<p class="font-title-md text-title-md text-primary mt-2">Admin Portal</p>
</div>
<!-- Login Form -->
<form class="w-full flex flex-col gap-stack-md" onsubmit="event.preventDefault();">
<div class="flex flex-col gap-stack-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase" for="username">ID (Username)</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant">person</span>
<input class="w-full bg-surface-container-lowest border border-border-subtle rounded-lg py-3 pl-10 pr-4 text-on-surface placeholder:text-outline-variant input-glow transition-all focus:ring-0" id="username" placeholder="Enter your ID" type="text"/>
</div>
</div>
<div class="flex flex-col gap-stack-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant">lock</span>
<input class="w-full bg-surface-container-lowest border border-border-subtle rounded-lg py-3 pl-10 pr-4 text-on-surface placeholder:text-outline-variant input-glow transition-all focus:ring-0" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<button class="btn-primary w-full rounded-full py-4 mt-stack-md flex items-center justify-center gap-2 font-title-md text-title-md text-white" type="submit">
                    Secure Login
                    <span class="material-symbols-outlined text-[20px]">login</span>
</button>
</form>
<!-- Security Note -->
<div class="mt-stack-lg flex items-center gap-2 text-outline font-label-sm text-label-sm">
<span class="material-symbols-outlined text-[16px] text-warning">warning</span>
<span class="uppercase tracking-widest">Authorized Access Only</span>
</div>
</div>
</main>
</body></html>
